<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Project Radar</title>
<style>
  :root {
    --bg: #060a14;
    --panel: #0d1420;
    --line: #1c2942;
    --accent: #3ddc97;
    --accent-dim: #1f6b4d;
    --text: #e6edf7;
    --text-dim: #8a97ad;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 32px 24px;
    text-align: center;
  }
  header h1 {
    font-size: 28px;
    letter-spacing: 1px;
    color: var(--accent);
  }
  header p {
    color: var(--text-dim);
    margin-top: 8px;
    font-size: 14px;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .status-banner {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: 16px 20px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <header>
    <h1>ARC PROJECT RADAR</h1>
    <p>Tracking the Arc ecosystem — Circle's stablecoin-native Layer-1</p>
  </header>
  <main>
    <div class="status-banner">
      🚧 Site under construction — project grid coming soon.
    </div>
  </main>
</body>
</html>
