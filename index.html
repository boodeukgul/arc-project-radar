<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Project Radar</title>
<style>
  :root {
    --bg: #060a14;
    --panel: #0d1420;
    --line: #1c2942;
    --accent: #3ddc97;
    --accent-dim: #1f6b4d;
    --text: #e6edf7;
    --text-dim: #8a97ad;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }

  /* Top bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 32px;
    border-bottom: 1px solid var(--line);
  }
  .topbar .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 14px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .saved-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
  }

  /* Hero */
  .hero {
    max-width: 1200px;
    margin: 0 auto;
    padding: 56px 32px 32px;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 40px;
    align-items: center;
  }
  .hero .tag {
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 2px;
    font-family: monospace;
    margin-bottom: 14px;
  }
  .hero h1 {
    font-size: 42px;
    line-height: 1.15;
    font-weight: 700;
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    color: var(--text-dim);
    margin-top: 16px;
    font-size: 15px;
    max-width: 480px;
    line-height: 1.6;
  }
  .stats {
    display: flex;
    gap: 32px;
    margin-top: 28px;
  }
  .stats div b {
    display: block;
    font-size: 24px;
  }
  .stats div span {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* Settlement rail visual */
  .rail-visual {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    height: 220px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 26px;
    padding: 0 24px;
  }
  .rail {
    position: relative;
    height: 2px;
    background: var(--line);
    border-radius: 2px;
  }
  .pulse {
    position: absolute;
    top: -3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: travel 3.2s linear infinite;
  }
  .rail:nth-child(2) .pulse { animation-duration: 2.4s; animation-delay: 0.4s; }
  .rail:nth-child(3) .pulse { animation-duration: 4s; animation-delay: 1s; }
  @keyframes travel {
    0% { left: 0%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { left: 96%; opacity: 0; }
  }
